<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply – Lab Assistant</title>
    <script src="common.js"></script>
  </head>
  <body>
    <h1>Lab Assistant application</h1>
    <form onsubmit="return false;">
      <p><label for="fn">First name</label> <input id="fn" /></p>
      <p><label for="ln">Last name</label> <input id="ln" /></p>
      <p><label for="em">Email</label> <input id="em" type="email" /></p>
      <p><label for="cv">Resume</label> <input id="cv" type="file" /></p>
      <div>
        <label
          ><input type="checkbox" id="c1" /> I certify that the information provided is accurate and complete.</label
        >
      </div>
      <div>
        <label><input type="checkbox" id="c2" /> I agree to the Terms of Service</label>
      </div>
      <div>
        <label
          ><input type="checkbox" id="c3" /> I want recruiters to contact me in relation to other relevant job
          opportunities. I understand that I can withdraw my consent at any time by clicking unsubscribe.</label
        >
      </div>
      <fieldset>
        <legend>
          By selecting "Consent", you consent to the processing of your personal data per the Privacy Notice. *
        </legend>
        <label><input type="radio" name="pd" id="r1" required /> Consent</label>
        <label><input type="radio" name="pd" id="r2" /> Do Not Consent</label>
      </fieldset>
      <p>
        <label for="pp">By selecting "I agree", my data is processed per the Candidate Privacy Policy. *</label>
        <select id="pp" required>
          <option value="">Select...</option>
          <option>I agree</option>
        </select>
      </p>
      <fieldset>
        <legend>Applicant Privacy Statement *</legend>
        <label
          ><input type="checkbox" name="aps" id="g1" required /> By clicking this box, you consent to our Applicant
          Privacy Statement.</label
        >
        <label
          ><input type="checkbox" name="aps" id="g2" /> By clicking this box, you consent to third-party background
          checks.</label
        >
      </fieldset>
      <p>
        <label for="ja">Receive alerts for similar jobs?</label>
        <select id="ja">
          <option value="">Select...</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </p>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
