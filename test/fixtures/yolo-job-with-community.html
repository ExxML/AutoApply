<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Software Engineer Intern – Acme Careers</title>
  </head>
  <body>
    <h1>Software Engineer Intern</h1>
    <p>Acme · Vancouver, BC, Canada</p>
    <p>Build tools our customers love. Summer 2027.</p>
    <a class="btn" role="button" onclick="location.href = 'yolo-apply.html'">Apply to this job</a>
    <!-- A required signup beside the posting: not the application. -->
    <section>
      <h3>Join our Talent Community</h3>
      <form onsubmit="event.preventDefault()">
        <label>First Name * <input required /></label>
        <label>Email Address * <input type="email" required /></label>
        <label
          >Area of interest *
          <select required>
            <option value="">Select</option>
            <option>Engineering</option>
            <option>Sales</option>
          </select></label
        >
        <button type="submit">Sign up</button>
      </form>
    </section>
  </body>
</html>
