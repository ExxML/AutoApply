<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job application – Data Intern</title>
    <script src="common.js"></script>
    <script src="vendor/react.js"></script>
    <script src="vendor/react-dom.js"></script>
  </head>
  <body>
    <h1>Data Intern application</h1>
    <div id="root"></div>
    <script>
      const h = React.createElement;
      function App() {
        const [s, set] = React.useState({
          firstName: "",
          lastName: "",
          email: "",
          phone: "",
          country: "",
          remote: false,
        });
        const bind = (k) => ({ value: s[k], onChange: (e) => set({ ...s, [k]: e.target.value }) });
        return h(
          "form",
          { onSubmit: (e) => e.preventDefault() },
          h("label", { htmlFor: "a" }, "First name"),
          h("input", { id: "a", ...bind("firstName") }),
          h("label", { htmlFor: "b" }, "Last name"),
          h("input", { id: "b", ...bind("lastName") }),
          h("label", { htmlFor: "c" }, "Email"),
          h("input", { id: "c", type: "email", ...bind("email") }),
          h("label", { htmlFor: "d" }, "Mobile phone"),
          h("input", { id: "d", type: "tel", ...bind("phone") }),
          h("label", { htmlFor: "e" }, "Country of residence"),
          h(
            "select",
            { id: "e", ...bind("country") },
            h("option", { value: "" }, "Select…"),
            h("option", { value: "US" }, "United States"),
            h("option", { value: "CA" }, "Canada"),
          ),
          h(
            "label",
            null,
            h("input", {
              type: "checkbox",
              checked: s.remote,
              onChange: (e) => set({ ...s, remote: e.target.checked }),
            }),
            " Open to remote work",
          ),
          h("label", { htmlFor: "f" }, "Resume"),
          h("input", { id: "f", type: "file" }),
          h("button", { type: "submit" }, "Submit application"),
          h("pre", { id: "echo" }, JSON.stringify(s)),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
