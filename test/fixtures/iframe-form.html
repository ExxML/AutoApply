<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job application</title>
    <script src="common.js"></script>
  </head>
  <body>
    <form onsubmit="return false;">
      <p><label for="fn">First name</label> <input id="fn" /></p>
      <p><label for="ln">Last name</label> <input id="ln" /></p>
      <p><label for="em">Email</label> <input id="em" type="email" /></p>
      <p><label for="ph">Phone</label> <input id="ph" type="tel" /></p>
      <p><label for="city">City</label> <input id="city" /></p>
      <p><label for="cv">Resume</label> <input id="cv" type="file" /></p>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
